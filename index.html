<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Prompts - Criadores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Gerador de Prompts</h1>
            <p>Automatize a criação de conteúdo para seus canais.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="channel">1. Qual é o Canal?</label>
                <select id="channel">
                    <option value="Gameplay">Canal de Gameplay</option>
                    <option value="Mind (Desenvolvimento Pessoal e Ideias)">Canal Mind (Desenvolvimento Pessoal)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="subject">2. Sobre o que é o vídeo/post?</label>
                <textarea id="subject" rows="4" placeholder="Ex: Como vencer o boss final de Elden Ring. Os pontos principais são: espada de fogo, esquivar..." autocomplete="off"></textarea>
            </div>

            <div class="form-group" id="network-group">
                <label for="network">3. Para qual Rede Social?</label>
                <select id="network">
                    <option value="youtube">YouTube</option>
                    <option value="tiktok">TikTok</option>
                    <option value="meta">Facebook & Instagram (Meta)</option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="include-thumb" onchange="toggleThumbOptions()">
                <label for="include-thumb">4. Gerar também um prompt para Thumbnail?</label>
            </div>

            <div class="form-group hidden" id="orientation-group">
                <label for="orientation">Orientação da Thumbnail</label>
                <select id="orientation">
                    <option value="Horizontal (16:9)">Horizontal (YouTube, Facebook padrão)</option>
                    <option value="Vertical (9:16)">Vertical (TikTok, Reels, Shorts)</option>
                </select>
            </div>

            <button type="button" onclick="generatePrompt()" class="btn-generate">Gerar Prompt Mestre</button>

            <div class="result-area">
                <div class="result-header">
                    <h3>Cole este prompt na IA:</h3>
                    <button type="button" onclick="copyToClipboard()" class="btn-copy">Copiar</button>
                </div>
                <textarea id="result" rows="12" readonly placeholder="Seu prompt aparecerá aqui..."></textarea>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
