<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Prompts - Criadores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Gerador de Prompts</h1>
            <p>Automatize a criação de conteúdo para seus canais.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="channel">1. Qual é o Canal?</label>
                <select id="channel">
                    <option value="Gameplay">Canal de Gameplay</option>
                    <option value="Mind (Desenvolvimento Pessoal e Ideias)">Canal Mind (Desenvolvimento Pessoal)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="subject">2. Sobre o que é o vídeo/post?</label>
                <input type="text" id="subject" placeholder="Ex: Como vencer o boss final de Elden Ring..." autocomplete="off">
            </div>

            <div class="form-group">
                <label for="goal">3. O que você quer gerar?</label>
                <select id="goal" onchange="toggleOptions()">
                    <option value="text">Títulos, Descrições e Tags (Texto)</option>
                    <option value="thumbnail">Prompt para Thumbnail (Imagem)</option>
                </select>
            </div>

            <div class="form-group" id="network-group">
                <label for="network">4. Para qual Rede Social?</label>
                <select id="network">
                    <option value="youtube">YouTube</option>
                    <option value="tiktok">TikTok</option>
                    <option value="meta">Facebook & Instagram (Meta)</option>
                </select>
            </div>

            <div class="form-group hidden" id="orientation-group">
                <label for="orientation">4. Orientação da Thumbnail</label>
                <select id="orientation">
                    <option value="Horizontal (16:9)">Horizontal (YouTube, Facebook padrão)</option>
                    <option value="Vertical (9:16)">Vertical (TikTok, Reels, Shorts)</option>
                </select>
            </div>

            <button onclick="generatePrompt()" class="btn-generate">Gerar Prompt Mestre</button>

            <div class="result-area">
                <div class="result-header">
                    <h3>Cole este prompt no ChatGPT/Claude:</h3>
                    <button onclick="copyToClipboard()" class="btn-copy">Copiar</button>
                </div>
                <textarea id="result" rows="10" readonly placeholder="Seu prompt aparecerá aqui..."></textarea>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
